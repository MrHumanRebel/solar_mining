version: "3.9"

services:
  solar:
    image: ghcr.io/mrhumanrebel/solar_mining:latest
    container_name: solar_monitor
    hostname: solarminer
    restart: unless-stopped
    entrypoint: ["/app/scripts/wait-for-dns.sh", "python", "solar.py"]
    environment:
      - MY_BOT_TOKEN=${MY_BOT_TOKEN}
      - MY_CHAT_ID=${MY_CHAT_ID}
      - MY_WEATHER_API=${MY_WEATHER_API}
      - MY_LOCATION_LAT=${MY_LOCATION_LAT}
      - MY_LOCATION_LON=${MY_LOCATION_LON}
      - MY_APP_ID=${MY_APP_ID}
      - MY_APP_SECRET=${MY_APP_SECRET}
      - MY_EMAIL=${MY_EMAIL}
      - MY_PASSWORD=${MY_PASSWORD}
      - MY_DEVICE_SN=${MY_DEVICE_SN}
      - MY_QUOTE_LIMIT=${MY_QUOTE_LIMIT}
      - MY_QUOTE_FILE=/app/quote_usage.json
      - MY_STATE_FILE=/app/state.json
      - WALLET_ADDRESS=${WALLET_ADDRESS:-0xaedac36dcfc956864fcc03ec2ef256facaefd991}
      - MY_MINING_ALGORITHM=${MY_MINING_ALGORITHM:-pearlpow}
      - MY_MINING_WORKER=${MY_MINING_WORKER:-solarminer}
      - MY_HISTORY_DIR=/app/solarman_json
      - MY_MINER_IP=${MY_MINER_IP:-192.168.0.185}
      - MY_MINER_MAC=${MY_MINER_MAC:-90:DE:80:BD:AD:BF}
      - MY_MINER_POWER_W=${MY_MINER_POWER_W:-750}
      - MY_BATTERY_CAPACITY_AH=${MY_BATTERY_CAPACITY_AH:-200}
      - MY_BATTERY_NOMINAL_V=${MY_BATTERY_NOMINAL_V:-55.2}
      - MY_BATTERY_FLOOR_SOC=${MY_BATTERY_FLOOR_SOC:-20}
      - MY_MIN_RUN_MINUTES=${MY_MIN_RUN_MINUTES:-18}
      - MY_BRIDGE_START_SAFETY_FACTOR=${MY_BRIDGE_START_SAFETY_FACTOR:-1.25}
      - MY_HARD_AFTERNOON_STOP_SOC=${MY_HARD_AFTERNOON_STOP_SOC:-90}
      - MY_HARD_AFTERNOON_STOP_HOUR=${MY_HARD_AFTERNOON_STOP_HOUR:-14}
      - MY_AFTERNOON_PV_STOP_W=${MY_AFTERNOON_PV_STOP_W:-50}
      - MY_WEB_PORT=9000
    ports:
      - "9000:9000"
    volumes:
      - ./scripts/wait-for-dns.sh:/app/scripts/wait-for-dns.sh
      - ./state.json:/app/state.json
      - ./quote_usage.json:/app/quote_usage.json
      - ./solarman_json:/app/solarman_json:ro
    devices:
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/i2c-1:/dev/i2c-1"
    privileged: true
    networks:
      pihole_backend:
        ipv4_address: 172.31.0.101
        aliases:
          - solarminer
    dns:
      - 172.31.0.100

networks:
  pihole_backend:
    external: true
