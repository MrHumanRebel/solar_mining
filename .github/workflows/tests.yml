name: Python regression tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runtime (no Raspberry Pi GPIO required)
        run: python -m pip install requests==2.34.2 Pillow==12.3.0 psutil==7.2.2 pytz==2026.5
      - name: Compile Python modules
        run: python -m compileall -q solar_mining tests
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
